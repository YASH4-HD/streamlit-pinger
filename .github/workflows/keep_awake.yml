name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every 30 minutes -- parallel pinger finishes in a couple of
    # minutes now, so this comfortably avoids overlap with the next run.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Pinger
        run: python ping_apps.py
